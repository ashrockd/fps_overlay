name: Generate release keystore (one-off)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17 (provides keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore + random password
        run: |
          # PKCS12 keystores (the default since JDK 9) require the store
          # password and key password to be identical -- keytool silently
          # ignores a distinct -keypass, so use one password for both.
          PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.jks" \
            -alias fpsoverlay \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=FPS Overlay, OU=, O=, L=, S=, C=US"
          base64 -w0 "$RUNNER_TEMP/release.jks" > "$RUNNER_TEMP/release.jks.base64"
          {
            echo "ANDROID_KEY_ALIAS=fpsoverlay"
            echo "ANDROID_KEYSTORE_PASSWORD=$PASS"
            echo "ANDROID_KEY_PASSWORD=$PASS"
          } > "$RUNNER_TEMP/keystore-credentials.txt"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/out/"
          cp "$RUNNER_TEMP/release.jks.base64" "$RUNNER_TEMP/out/"
          cp "$RUNNER_TEMP/keystore-credentials.txt" "$RUNNER_TEMP/out/"

      - name: Upload keystore + credentials (download once, then delete this workflow)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-DELETE-AFTER-DOWNLOAD
          path: ${{ runner.temp }}/out
          retention-days: 1
