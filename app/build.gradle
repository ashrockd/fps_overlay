apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.ashish.fpsoverlay'
    compileSdk 35

    defaultConfig {
        applicationId "com.ashish.fpsoverlay"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    // Release signing is read from env vars so no secrets ever live in this file
    // or get committed to the repo. Locally these are simply unset and the
    // release build config falls back to unsigned (CI supplies them as
    // GitHub Actions secrets).
    def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
    def hasReleaseSigning = keystorePath != null && file(keystorePath).exists()

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        buildConfig false
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
}
